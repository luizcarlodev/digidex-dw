<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DIGIDEX - Detalhes</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@1,700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="css/detalhe.css" />
    </head>
    <body>
        <header>
            <div class="container-header">
                <img
                    src="assets/logotipo/logotipo-header.png"
                    alt="logotipo-header"
                />
            </div>
        </header>

        <main>
            <div class="container__body">
                <section class="SHeader">
                    <h1 id="nome"></h1>
                    <p id="numero"></p>
                </section>

                <section class="SInfos">
                    <img id="imagem" src="" alt="" />
                    <dl>
                        <div>
                            <dt>tipo</dt>
                            <dd id="tipo"></dd>
                        </div>
                        <div>
                            <dt>nível</dt>
                            <dd id="nivel"></dd>
                        </div>
                        <div>
                            <dt>atributo</dt>
                            <dd id="atributo"></dd>
                        </div>
                        <div>
                            <dt>área</dt>
                            <dd id="area"></dd>
                        </div>
                    </dl>
                </section>

                <section class="SDescricao">
                    <h2>Descrição</h2>
                    <p id="descricao"></p>
                </section>

                <section class="SSkills">
                    <h2>Habilidades</h2>
                    <ul id="habilidades"></ul>
                </section>

                <section class="SBtn-index">
                    <a class="btn-voltar" href="index.html">Voltar</a>
                </section>
            </div>

            <nav class="navegacao" aria-label="Navegar entre Digimons">
                <button id="btn-anterior" type="button">&lt;</button>
                <span id="id-atual"></span>
                <button id="btn-proximo" type="button">&gt;</button>
            </nav>
        </main>

        <footer>
            <div class="container-footer">
                <div class="conteudo-footer">
                    <p>© 2026 IFRN. Todos os direitos reservados.</p>
                </div>
            </div>
        </footer>

        <script src="js/detalhe.js"></script>
    </body>
</html>
