<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DIGIDEX - Início</title>

        <link
            rel="shortcut icon"
            href="assets/favicon.png"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header>
            <div class="container-header">
                <a href="index.html">
                    <img
                        src="assets/logotipo/logotipo-header.png"
                        alt="logotipo-header"
                /></a>
            </div>
        </header>

        <main>
            <div class="container-body">
                <div class="container-conteudo">
                    <div class="container-ferramentas">
                        <form>
                            <input
                                class="search-input"
                                id="busca"
                                type="text"
                                placeholder="Buscar por nome ou ID..."
                            />
                        </form>
                        <button id="btn-ordem">Ordenar por ID</button>
                        <button id="btn-surpreenda" type="button">
                            Me surpreenda
                        </button>
                    </div>

                    <div id="lista-digimons"></div>
                </div>

                <nav class="paginacao" aria-label="Navegar entre Digimons">
                    <button id="pagina-anterior" type="button" disabled>
                        &lt;
                    </button>
                    <span id="pagina-atual">1</span>
                    <button id="pagina-proxima" type="button">&gt;</button>
                </nav>
            </div>
        </main>

        <footer>
            <div class="container-footer">
                <div class="conteudo-footer">
                    <p>© 2026 IFRN. Todos os direitos reservados.</p>
                </div>
            </div>
        </footer>

        <script src="js/main.js"></script>
    </body>
</html>
